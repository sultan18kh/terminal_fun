[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "terminal_fun"
version = "0.1.0"
description = "A collection of fun, visually striking terminal-based tools and animations"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Sultan Khan" },
]
dependencies = [
    "rich>=13.0.0",
    "pyfiglet>=1.0.0",
    "typer>=0.9.0",
]

[project.scripts]
terminal-fun = "terminal_fun.__main__:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
